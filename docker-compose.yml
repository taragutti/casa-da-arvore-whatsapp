services:
  postgres:
    image: postgres:16-alpine
    container_name: casa_da_arvore_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: casa_da_arvore
    ports:
      - "5432:5432"
    volumes:
      - casa_da_arvore_pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: casa_da_arvore_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - casa_da_arvore_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  casa_da_arvore_pgdata:
  casa_da_arvore_redisdata:
